name: Mobile apps

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the APK and IPA, e.g. v1.0.0 (leave empty to just build)"
        required: false
        default: ""

# The release to publish: a pushed v* tag, or the version typed when running the workflow by hand.
env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release || '' }}

jobs:
  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  journeys:
    name: User journeys · iPhone & Android
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-report
          path: playwright-report

  android:
    name: Android · debug APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # Sign every build with the same key so new versions install over old ones (see android/keystore).
      - name: Use the fixed signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else cp android/keystore/sideload-debug.keystore ~/.android/debug.keystore; fi
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: W-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Pushing a tag like v1.0.0 publishes a GitHub Release with the APK attached.
      # W.apk keeps the same name in every release, so ".../releases/latest/download/W.apk" always works.
      - if: env.RELEASE != ''
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk W-${{ env.RELEASE }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk W.apk
      - if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          name: W ${{ env.RELEASE }}
          make_latest: true
          body: |
            ## Install

            | | Android | iPhone |
            |---|---|---|
            | **Download** | [W.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE }}/W.apk) | [W.ipa](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE }}/W.ipa) |
            | **Install** | Open the APK and allow **Install unknown apps** | **No Mac needed:** Sideloadly or AltStore on Windows or Mac with your Apple ID |

            📖 Step-by-step guide with troubleshooting: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/INSTALL.md)
          generate_release_notes: true
          files: |
            W.apk
            W-${{ env.RELEASE }}.apk

  ios:
    name: iOS · unsigned IPA (for Sideloadly / AltStore)
    runs-on: macos-15
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # A real-device (arm64) Release build without code signing. Sideloadly or AltStore signs it
      # with the user's own Apple ID when installing, so no Mac or paid developer account is needed.
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build
      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry W-unsigned.ipa Payload
          ls -lh W-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: W-ios-unsigned-ipa
          path: W-unsigned.ipa
      - if: env.RELEASE != ''
        run: |
          cp W-unsigned.ipa W-${{ env.RELEASE }}-unsigned.ipa
          cp W-unsigned.ipa W.ipa
      # Only attaches files: the Android job writes the release notes.
      - if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          name: W ${{ env.RELEASE }}
          files: |
            W.ipa
            W-${{ env.RELEASE }}-unsigned.ipa
