name: Mobile apps

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  journeys:
    name: User journeys · iPhone & Android
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-report
          path: playwright-report

  android:
    name: Android · debug APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Set the repository variable API_URL to your deployed server so photo analysis works in the app.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: W-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Pushing a tag like v1.0.0 publishes a GitHub Release with the APK attached.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk W-${{ github.ref_name }}.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: W-${{ github.ref_name }}.apk
          generate_release_notes: true

  ios:
    name: iOS · unsigned IPA (for Sideloadly / AltStore)
    runs-on: macos-15
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npx cap sync ios
      # A real-device (arm64) Release build without code signing. Sideloadly or AltStore signs it
      # with the user's own Apple ID when installing, so no Mac or paid developer account is needed.
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" build
      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry W-unsigned.ipa Payload
          ls -lh W-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: W-ios-unsigned-ipa
          path: W-unsigned.ipa
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp W-unsigned.ipa W-${{ github.ref_name }}-unsigned.ipa
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: W-${{ github.ref_name }}-unsigned.ipa
          generate_release_notes: true
